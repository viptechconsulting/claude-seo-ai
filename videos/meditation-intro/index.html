<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Slumber — Rest starts here</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Newsreader"; src: local("Liberation Serif"), local("DejaVu Serif"); }
      @font-face { font-family: "Hanken Grotesk"; src: local("DejaVu Sans"), local("Liberation Sans"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #14111f; }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        font-family: "Hanken Grotesk", Inter, "DejaVu Sans", system-ui, sans-serif;
        color: #f6ead8;
      }
      .serif { font-family: Newsreader, Georgia, "Liberation Serif", "DejaVu Serif", serif; }

      /* ---------- background ---------- */
      #bg {
        position: absolute; inset: 0;
        background: linear-gradient(180deg, #1b1630 0%, #14111f 55%, #0e0c17 100%);
      }
      #glow {
        position: absolute; left: 50%; top: 52%;
        width: 1500px; height: 1500px; margin: -750px 0 0 -750px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255,176,120,0.55) 0%, rgba(214,120,96,0.22) 35%, rgba(20,17,31,0) 68%);
        opacity: 0;
        filter: blur(30px);
      }

      /* ---------- scene 1 ---------- */
      #s1 { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px; text-align: center; padding: 0 120px; }
      #s1 .l1 { font-size: 104px; line-height: 1.1; font-weight: 400; letter-spacing: -0.01em; opacity: 0; }
      #s1 .l2 { font-size: 58px; font-style: italic; color: #e9c9a6; opacity: 0; }

      /* ---------- scene 2 (timer) ---------- */
      #s2 { position: absolute; inset: 0; }
      #timer { position: absolute; left: 50%; top: 52%; width: 760px; height: 760px; margin: -380px 0 0 -380px; }
      #halo {
        position: absolute; left: 50%; top: 50%; width: 520px; height: 520px; margin: -260px 0 0 -260px;
        border-radius: 50%;
        background: radial-gradient(circle at 50% 42%, #ffd2a4 0%, #f2a37b 45%, #c86f6a 100%);
        box-shadow: 0 0 140px 40px rgba(255,170,120,0.35);
        opacity: 0.92;
      }
      #ring { position: absolute; inset: 0; width: 760px; height: 760px; transform: rotate(-90deg); }
      #ring circle { fill: none; stroke-linecap: round; }
      #ring .track { stroke: rgba(246,234,216,0.16); stroke-width: 4; }
      #ring .prog { stroke: #f6ead8; stroke-width: 6; }
      #center { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; width: 520px; }
      #count { position: relative; height: 190px; }
      #count span { position: absolute; left: 0; right: 0; top: 0; font-size: 190px; line-height: 190px; font-weight: 300; color: #2a1830; opacity: 0; }
      #phase { position: relative; height: 70px; margin-top: 8px; }
      #phase span { position: absolute; left: 0; right: 0; top: 0; font-size: 46px; line-height: 70px; letter-spacing: 0.04em; color: #2a1428; font-weight: 600; opacity: 0; }
      #meta {
        position: absolute; left: 0; right: 0; top: 1500px; text-align: center;
        font-size: 34px; letter-spacing: 0.22em; text-transform: uppercase; color: #d9bd9d; opacity: 0;
      }
      #hint {
        position: absolute; left: 0; right: 0; top: 330px; text-align: center;
        font-size: 50px; font-style: italic; color: #f0dcc0; opacity: 0;
      }

      /* ---------- scene 3 ---------- */
      #s3 { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 100px; }
      #s3 .big { font-size: 138px; line-height: 1.08; font-weight: 400; letter-spacing: -0.015em; opacity: 0; }
      #s3 .rule { width: 90px; height: 3px; background: #e9c9a6; margin: 64px 0 40px; opacity: 0; transform-origin: center; }
      #s3 .brand { font-size: 36px; letter-spacing: 0.42em; text-transform: uppercase; color: #e9c9a6; opacity: 0; padding-left: 0.42em; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1080" data-height="1920">
      <div id="bg" class="clip" data-start="0" data-duration="15" data-track-index="0">
        <div id="glow"></div>
      </div>

      <section id="s1" class="clip" data-start="0" data-duration="3.4" data-track-index="1">
        <p class="l1 serif" id="l1">Still awake?</p>
        <p class="l2 serif" id="l2">That’s okay.</p>
      </section>

      <section id="s2" class="clip" data-start="3" data-duration="8.3" data-track-index="2">
        <p id="hint" class="serif">Follow the circle.</p>
        <div id="timer">
          <div id="halo"></div>
          <svg id="ring" viewBox="0 0 760 760">
            <circle class="track" cx="380" cy="380" r="360"></circle>
            <circle id="prog" class="prog" cx="380" cy="380" r="360" stroke-dasharray="2262" stroke-dashoffset="2262"></circle>
          </svg>
          <div id="center">
            <div id="count">
              <span id="n1">4</span><span id="n2">3</span><span id="n3">2</span><span id="n4">1</span>
              <span id="n5">4</span><span id="n6">3</span><span id="n7">2</span><span id="n8">1</span>
            </div>
            <div id="phase" class="serif">
              <span id="pin">Breathe in</span><span id="pout">Breathe out</span>
            </div>
          </div>
        </div>
        <p id="meta">4 · 4 breathing &nbsp;·&nbsp; 5 min</p>
      </section>

      <section id="s3" class="clip" data-start="11" data-duration="4" data-track-index="3">
        <p class="big serif" id="big">Rest starts<br />here.</p>
        <div class="rule" id="rule"></div>
        <p class="brand" id="brand">Slumber</p>
      </section>

      <audio id="pad" src="assets/ambient-pad.wav" data-start="0" data-duration="15" data-track-index="9" data-volume="1"></audio>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      const soft = "sine.inOut";

      // ---- background glow: wakes, then slowly dims toward sleep ----
      tl.to("#glow", { opacity: 0.55, duration: 2.4, ease: "sine.out" }, 0);
      tl.to("#glow", { opacity: 0.85, duration: 4, ease: soft }, 3);
      tl.to("#glow", { opacity: 0.45, duration: 4, ease: soft }, 7);
      tl.to("#glow", { opacity: 0.7, scale: 0.9, duration: 3.5, ease: "sine.out" }, 11);

      // ---- scene 1 ----
      tl.fromTo("#l1", { y: 18 }, { opacity: 1, y: 0, duration: 1.1, ease: "power2.out" }, 0.5);
            tl.to("#l2", { opacity: 1, duration: 1.0, ease: "power2.out" }, 1.5);
      tl.to(["#l1", "#l2"], { opacity: 0, duration: 0.5, ease: "power1.in" }, 2.7);

      // ---- scene 2: breathing timer (inhale 3.0-7.0, exhale 7.0-11.0 would end at 11; UI fades 10.6-11.2) ----
      const T0 = 3.2; // timer starts after scene 1 clears
      tl.to("#hint", { opacity: 0.9, duration: 0.8, ease: "power1.out" }, 3.1);
      tl.to("#hint", { opacity: 0, duration: 0.6, ease: "power1.in" }, 4.1);
      tl.to("#meta", { opacity: 0.85, duration: 0.9, ease: "power1.out" }, 3.4);

      // halo: expand on inhale, contract on exhale (4s / 3.5s)
      tl.fromTo("#halo", { scale: 0.78 }, { scale: 1.08, duration: 4, ease: soft }, T0);
      tl.to("#halo", { scale: 0.78, duration: 3.6, ease: soft }, T0 + 4);

      // progress ring
      tl.fromTo("#prog", { strokeDashoffset: 2262 }, { strokeDashoffset: 0, duration: 4, ease: "none" }, T0);
      tl.to("#prog", { strokeDashoffset: 2262, duration: 3.6, ease: "none" }, T0 + 4);

      // phase label
      tl.to("#pin", { opacity: 1, duration: 0.5 }, T0);
      tl.to("#pin", { opacity: 0, duration: 0.4 }, T0 + 3.6);
      tl.to("#pout", { opacity: 1, duration: 0.5 }, T0 + 4);
      tl.to("#pout", { opacity: 0, duration: 0.3 }, T0 + 7.3);

      // countdown: 4-3-2-1 then 4-3-2-1 (hold 0.9s each, short crossfades)
      const slot = (id, start, end) => {
        tl.to(id, { opacity: 1, duration: 0.25, ease: "power1.out" }, start);
        tl.to(id, { opacity: 0, duration: 0.2, ease: "power1.in" }, end - 0.2);
      };
      slot("#n1", T0, T0 + 1);
      slot("#n2", T0 + 1, T0 + 2);
      slot("#n3", T0 + 2, T0 + 3);
      slot("#n4", T0 + 3, T0 + 4);
      slot("#n5", T0 + 4, T0 + 5);
      slot("#n6", T0 + 5, T0 + 6);
      slot("#n7", T0 + 6, T0 + 7);
      slot("#n8", T0 + 7, T0 + 7.7);

      // whole timer + meta exit
      tl.to(["#timer", "#meta"], { opacity: 0, duration: 0.7, ease: "power1.in" }, 10.5);

      // ---- scene 3 ----
      tl.fromTo("#big", { y: 22 }, { y: 0, opacity: 1, duration: 1.4, ease: "power2.out" }, 11.5);
      tl.to("#big", { scale: 1.03, duration: 3.4, ease: "none" }, 11.5);
      tl.fromTo("#rule", { scaleX: 0 }, { scaleX: 1, opacity: 0.9, duration: 1.0, ease: "power2.out" }, 13.0);
      tl.to("#brand", { opacity: 0.9, duration: 1.0, ease: "power1.out" }, 13.2);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
